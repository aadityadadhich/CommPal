services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: commpal-backend:local
    container_name: commpal-backend
    ports:
      # Localhost only: the API has no login yet, so don't expose it to your network.
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Forces the database onto the persistent volume, even if a .env file sets another path.
      DATABASE_URL: sqlite:////data/commpal.db
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:7b
    env_file:
      # Optional. Put GEMINI_API_KEY, CHANNEL3_API_KEY, or PayPal sandbox keys in a root .env (git-ignored).
      - path: .env
        required: false
    volumes:
      - commpal-data:/data
    restart: unless-stopped

volumes:
  commpal-data:
