[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "commpal-payments"
version = "0.1.0"
description = "Extensible payment API foundation for CommPal"
readme = "README.md"
requires-python = "==3.14.7"
dependencies = [
    "Django>=6.0,<6.1",
    "djangorestframework>=3.16,<4.0",
    "dj-database-url>=2.3,<4.0",
    "psycopg[binary]>=3.2,<4.0",
]

[project.optional-dependencies]
dev = ["coverage>=7.6,<8.0"]

[tool.setuptools.packages.find]
include = ["config*", "payments*"]
